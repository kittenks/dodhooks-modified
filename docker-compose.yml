version: '3.8'

services:
  dodhooks-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: dodhooks-builder:latest
    volumes:
      - .:/work
    working_dir: /work
    # Default: just open a shell; override with `docker-compose run dodhooks-builder <cmd>`
    tty: true
    stdin_open: true
