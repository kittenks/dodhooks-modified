  runs-on: ${{ matrix.os }}

steps:
  # 1. 检出当前仓库代码
  - name: Checkout source
    uses: actions/checkout@v4

  # 2. 检出依赖项 (SourceMod, MM, SDK, AMBuild)
  # 注意：这里指定 path 为 sourcemod, mmsource 等，对应 configure.py 里的 --sm-path
  - name: Checkout SourceMod
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/sourcemod
      path: sourcemod

  - name: Checkout MetaMod:Source
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/metamod-source
      path: mmsource

  - name: Checkout hl2sdk-dods
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/hl2sdk
      ref: dods
      path: hl2sdk-dods

  - name: Checkout AMBuild
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/ambuild
      path: ambuild

  # 3. 设置 Python 3.11
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  # 4. 【核心修复】安装特定版本的 AMBuild
  # 指定安装 2.2.0 版本，该版本与你代码中的 API 兼容
  - name: Install AMBuild
    run: pip install ./ambuild==2.2.0

  # 5. Linux x86 额外依赖
  - name: Install Linux x86 dependencies
    if: runner.os == 'Linux' && matrix.arch == 'x86'
    run: |
      sudo dpkg --add-architecture i386
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        gcc-multilib g++-multilib lib32stdc++6 \
        zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

  # 6. 设置 MSVC (仅 Windows)
  - name: Setup MSVC
    if: runner.os == 'Windows'
    uses: ilammy/msvc-dev-cmd@v1
    with:
      arch: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

  # 7. Linux 配置
  - name: Configure (Linux)
    if: runner.os == 'Linux'
    working-directory: src
    run: |
      rm -rf build
      mkdir build && cd build
      python3 ../configure.py \
        --targets=${{ matrix.arch }} \
        --enable-optimize \
        --sm-path=$GITHUB_WORKSPACE/sourcemod \
        --mms-path=$GITHUB_WORKSPACE/mmsource \
        --hl2sdk-root=$GITHUB_WORKSPACE \
        --sdks=dod

  # 8. Windows 配置
  - name: Configure (Windows)
    if: runner.os == 'Windows'
    working-directory: src
    shell: cmd
    run: |
      if exist build rmdir /s /q build
      mkdir build && cd build
      python ../configure.py ^
        --targets=${{ matrix.arch }} ^
        --enable-optimize ^
        --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
        --mms-path=%GITHUB_WORKSPACE%\mmsource ^
        --hl2sdk-root=%GITHUB_WORKSPACE% ^
        --sdks=dod

  # 9. 编译
  - name: Build
    working-directory: src/build
    run: ambuild

  # 10. 上传产物
  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
      path: src/build/package/*
      if-no-files-found: error
