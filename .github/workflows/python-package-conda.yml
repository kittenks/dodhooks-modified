runs-on: ${{ matrix.os }}

steps:
  # 1. 检出代码 (包括子模块)
  - name: Checkout source
    uses: actions/checkout@v4
    with:
      submodules: recursive

  # 2. 检出 HL2SDK (DoD S)
  - name: Checkout hl2sdk-dods
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/hl2sdk
      ref: dods
      path: hl2sdk-dods

  # 3. 检出 AMBuild
  - name: Checkout AMBuild
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/ambuild
      path: ambuild

  # 4. 设置 Python 3.11
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  # 5. 安装 AMBuild
  - name: Install AMBuild
    run: pip install ./ambuild

  # 6. Linux x86 额外依赖
  - name: Install Linux x86 dependencies
    if: runner.os == 'Linux' && matrix.arch == 'x86'
    run: |
      sudo dpkg --add-architecture i386
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        gcc-multilib g++-multilib lib32stdc++6 \
        zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

  # 7. 设置 MSVC (仅 Windows)
  - name: Setup MSVC
    if: runner.os == 'Windows'
    uses: ilammy/msvc-dev-cmd@v1
    with:
      arch: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

  # 8. Linux 配置
  - name: Configure (Linux)
    if: runner.os == 'Linux'
    working-directory: src
    run: |
      rm -rf build
      mkdir build && cd build
      python3 ../configure.py \
        --targets=${{ matrix.arch }} \
        --enable-optimize \
        --sm-path=$GITHUB_WORKSPACE/sourcemod \
        --mms-path=$GITHUB_WORKSPACE/mmsource \
        --hl2sdk-root=$GITHUB_WORKSPACE \
        --sdks=dod

  # 9. Windows 配置
  - name: Configure (Windows)
    if: runner.os == 'Windows'
    working-directory: src
    shell: cmd
    run: |
      if exist build rmdir /s /q build
      mkdir build && cd build
      python ../configure.py ^
        --targets=${{ matrix.arch }} ^
        --enable-optimize ^
        --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
        --mms-path=%GITHUB_WORKSPACE%\mmsource ^
        --hl2sdk-root=%GITHUB_WORKSPACE% ^
        --sdks=dod

  # 10. 编译
  - name: Build
    working-directory: src/build
    run: ambuild

  # 11. 上传产物
  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
      path: src/build/package/*
      if-no-files-found: error
