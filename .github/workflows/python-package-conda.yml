      steps:
  - name: Checkout source
    uses: actions/checkout@v4
    with:
      submodules: recursive

  # ─── 关键修复：安装 AMBuild 到 Python 环境 ───
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11" # 使用稳定的 3.11 版本

  - name: Install AMBuild (Linux/macOS)
    if: runner.os != 'Windows'
    run: |
      python3 -m venv $AMBUILD_VENV
      source $AMBUILD_VENV/bin/activate
      pip install ./ambuild # 安装本地 ambuild 目录为包

  - name: Install AMBuild (Windows)
    if: runner.os == 'Windows'
    run: |
      python -m venv $env:AMBUILD_VENV
      . $env:AMBUILD_VENV/Scripts/activate
      pip install ./ambuild # 安装本地 ambuild 目录为包

  # ─── 准备 HL2SDK ───
  - name: Checkout hl2sdk-dods
    uses: actions/checkout@v4
    with:
      repository: alliedmodders/hl2sdk
      ref: dods
      path: hl2sdk-dods

  # ─── 安装系统级编译依赖 ───
  - name: Install Linux x86_64 dependencies
    if: runner.os == 'Linux' && matrix.arch == 'x86_64'
    run: sudo apt-get update && sudo apt-get install -y clang libc6-dev

  - name: Setup MSVC
    if: runner.os == 'Windows'
    uses: ilammy/msvc-dev-cmd@v1
    with:
      arch: ${{ matrix.msvc_arch }}

  # ─── Linux 构建流程 ───
  - name: Configure (Linux)
    if: runner.os == 'Linux'
    working-directory: src
    env:
      VIRTUAL_ENV: ${{ env.AMBUILD_VENV }}
      PATH: ${{ env.AMBUILD_VENV }}/bin:$PATH
    run: |
      rm -rf build
      mkdir build && cd build
      python3 ../configure.py \
        --targets=${{ matrix.arch }} \
        --enable-optimize \
        --sm-path=$GITHUB_WORKSPACE/sourcemod \
        --mms-path=$GITHUB_WORKSPACE/mmsource \
        --hl2sdk-root=$GITHUB_WORKSPACE \
        --sdks=dod
    continue-on-error: false

  - name: Build (Linux)
    if: runner.os == 'Linux'
    working-directory: src/build
    env:
      VIRTUAL_ENV: ${{ env.AMBUILD_VENV }}
      PATH: ${{ env.AMBUILD_VENV }}/bin:$PATH
    run: ambuild

  # ─── Windows 构建流程 ───
  - name: Configure (Windows)
    if: runner.os == 'Windows'
    shell: cmd
    working-directory: src
    env:
      VIRTUAL_ENV: ${{ env.AMBUILD_VENV }}
      PATH: ${{ env.AMBUILD_VENV }}\Scripts;%PATH%
    run: |
      if exist build rmdir /s /q build
      mkdir build && cd build
      python ../configure.py ^
        --targets=${{ matrix.arch }} ^
        --enable-optimize ^
        --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
        --mms-path=%GITHUB_WORKSPACE%\mmsource ^
        --hl2sdk-root=%GITHUB_WORKSPACE% ^
        --sdks=dod
    continue-on-error: false

  - name: Build (Windows)
    if: runner.os == 'Windows'
    shell: cmd
    working-directory: src/build
    env:
      VIRTUAL_ENV: ${{ env.AMBUILD_VENV }}
      PATH: ${{ env.AMBUILD_VENV }}\Scripts;%PATH%
    run: ambuild

  # ─── 上传产物 ───
  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
      path: src/build/package/*
      if-no-files-found: error
