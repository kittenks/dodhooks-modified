name: Build DODHooks

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64, tag: x64 }
          - { os: ubuntu-22.04, target: x86,    tag: x86 }
          - { os: windows-2022, target: x86_64, tag: win64 }
          - { os: windows-2022, target: x86,    tag: win32 }

    steps:
      - name: Checkout extension
        uses: actions/checkout@v5
        with: { submodules: recursive }

      - name: Checkout SM SDK
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: deps/sourcemod

      - name: Checkout MM:S
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: deps/mmsource
          submodules: recursive

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: deps/hl2sdk-dods

      # ── Linux 32-bit toolchain ──────────────────────
      - name: Install multilib (x86)
        if: runner.os == 'Linux' && matrix.target == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib libstdc++6:i386

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install AMBuild
        run: pip install git+https://github.com/alliedmodders/ambuild.git

      # ── Linux Build ──────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build
          python3 ../configure.py \
            --sm-path ../deps/sourcemod \
            --mms-path ../deps/mmsource \
            --hl2sdk-root ../deps \
            --target ${{ matrix.target }} \
            --enable-optimize

      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: ambuild build

      # ── Windows Build ───────────────────────────────
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.target == 'x86_64' && 'x64' || 'x86' }}
          if not exist build mkdir build
          cd build
          python ../configure.py ^
            --sm-path ../deps/sourcemod ^
            --mms-path ../deps/mmsource ^
            --hl2sdk-root ../deps ^
            --target ${{ matrix.target }} ^
            --enable-optimize

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd build
          ambuild

      # ── Debug / Package steps (run on both OS types) ─────────────────
      - name: Show build tree
        run: |
          echo "=== ls build (root) ==="
          ls -la build || true
          echo "=== find build files ==="
          find build -type f -maxdepth 6 -print || true
        if: runner.os == 'Linux'

      - name: Show build tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Get-ChildItem build -Recurse ==="
          if (Test-Path build) { Get-ChildItem build -Recurse | Format-Table } else { Write-Host "build not found" }

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          # try ambuild package if available
          if command -v ambuild >/dev/null 2>&1; then
            echo "Attempting ambuild package (may be no-op if unsupported)..."
            ambuild package || true
          fi
          mkdir -p build/package
          # copy common artifact types
          find build -type f \( -iname '*.smx' -o -iname '*.so' -o -iname '*.dll' -o -iname '*.zip' -o -iname '*.tar.gz' \) -exec bash -c 'for f; do mkdir -p build/package/$(dirname "$f"); cp --parents "$f" build/package/; done' _ {} +
          # fallback: if build/package is empty, tar the entire build dir
          if [ -z "$(ls -A build/package 2>/dev/null || true)" ]; then
            echo "No recognized artifact found — creating fallback tarball"
            tar -czf build/package/build.tar.gz -C build .
          fi
          echo "Contents of build/package:"
          ls -la build/package || true

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command ambuild -ErrorAction SilentlyContinue) {
            Write-Host "Attempting ambuild package (may be no-op if unsupported)..."
            try { ambuild package } catch { Write-Host "ambuild package failed: $_" }
          }
          New-Item -ItemType Directory -Force -Path build\package | Out-Null
          $patterns = @('*.smx','*.so','*.dll','*.zip','*.tar.gz')
          foreach ($p in $patterns) {
            Get-ChildItem -Path build -Recurse -File -Filter $p -ErrorAction SilentlyContinue | ForEach-Object {
              $dest = Join-Path 'build\package' ($_.FullName.Substring((Get-Location).Path.Length).TrimStart('\'))
              $destDir = Split-Path $dest -Parent
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              Copy-Item -Path $_.FullName -Destination $destDir -Force
            }
          }
          # fallback: if build\package still empty, zip the build folder
          if (-not (Get-ChildItem -Path build\package -Recurse -File -ErrorAction SilentlyContinue)) {
            Write-Host "No recognized artifact found — creating fallback zip"
            Compress-Archive -Path build\* -DestinationPath build\package\build.zip -Force
          }
          Get-ChildItem -Path build\package -Recurse | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ matrix.tag }}
          path: build/package/**
          
  release:
    # runs only on pushed tags (e.g., refs/tags/v1.2.3)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**
