name: Build

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SM_BRANCH: "1.12-dev"
  MMSOURCE_BRANCH: "1.12-dev"
  HL2SDK_DODS_BRANCH: "dods"
  PYTHON_VERSION: "3.11"

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout dodhooks
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: dodhooks

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ env.SM_BRANCH }}
          path: sourcemod

      - name: Checkout MM:S
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ env.MMSOURCE_BRANCH }}
          path: mmsource

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ env.HL2SDK_DODS_BRANCH }}
          path: hl2sdk-dods

      - name: Checkout AMBuild (2.2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          ref: 2.2
          path: ambuild

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AMBuild
        run: |
          python -m pip install --upgrade pip
          pip install ./ambuild

      - name: Install multilib (x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib lib32stdc++6 \
            zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

      - name: Configure
        working-directory: dodhooks
        env:
          CC: gcc
          CXX: g++
        run: |
          rm -rf build
          mkdir build && cd build
          python3 ../configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=$GITHUB_WORKSPACE/sourcemod \
            --mms-path=$GITHUB_WORKSPACE/mmsource \
            --hl2sdk-root=$GITHUB_WORKSPACE \
            --sdks=dod

      - name: Build
        working-directory: dodhooks/build
        run: ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-Linux-${{ matrix.arch }}
          path: dodhooks/build/package/*
          if-no-files-found: error

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]
    runs-on: windows-2022

    steps:
      - name: Checkout dodhooks
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: dodhooks

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ env.SM_BRANCH }}
          path: sourcemod

      - name: Checkout MM:S
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ env.MMSOURCE_BRANCH }}
          path: mmsource

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ env.HL2SDK_DODS_BRANCH }}
          path: hl2sdk-dods

      - name: Checkout AMBuild (2.2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          ref: 2.2
          path: ambuild

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AMBuild
        run: |
          python -m pip install --upgrade pip
          pip install .\ambuild

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

      - name: Configure
        working-directory: dodhooks
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          mkdir build && cd build
          python ..\configure.py ^
            --targets=${{ matrix.arch }} ^
            --enable-optimize ^
            --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
            --mms-path=%GITHUB_WORKSPACE%\mmsource ^
            --hl2sdk-root=%GITHUB_WORKSPACE% ^
            --sdks=dod

      - name: Build
        working-directory: dodhooks/build
        run: ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-Windows-${{ matrix.arch }}
          path: dodhooks/build/package/*
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for d in dodhooks-*; do zip -r "../$d.zip" "$d"; done
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: dodhooks-*.zip
