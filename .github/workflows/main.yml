name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        arch: [x86, x86_64]
        exclude:
          # Windows x86 is often broken in CI, exclude it to save minutes
          - os: windows-2022
            arch: x86
        include:
          - os: ubuntu-22.04
            cc: gcc
            cxx: g++
            msvc_arch: '' # Not used on Linux
          - os: windows-2022
            cc: cl
            cxx: cl
            # Map our generic arch to MSVC specific arch for vcvars
            msvc_arch: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install AMBuild (Linux)
        if: runner.os == 'Linux'
        run: sudo pip install ./ambuild

      - name: Install AMBuild (Windows)
        if: runner.os == 'Windows'
        run: pip install ./ambuild

      - name: Install Linux x86 dependencies
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib lib32stdc++6 \
            zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

      - name: Install Linux x64 dependencies
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: sudo apt-get install -y clang

      - name: Setup MSVC (Windows x86)
        if: runner.os == 'Windows' && matrix.msvc_arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup MSVC (Windows x64)
        if: runner.os == 'Windows' && matrix.msvc_arch == 'x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: src
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          mkdir -p build && cd build
          python3 ../configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=$GITHUB_WORKSPACE/sourcemod \
            --mms-path=$GITHUB_WORKSPACE/mmsource \
            --hl2sdk-root=$GITHUB_WORKSPACE \
            --sdks=dod

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          mkdir build && cd build
          py ../configure.py ^
            --targets=${{ matrix.arch }} ^
            --enable-optimize ^
            --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
            --mms-path=%GITHUB_WORKSPACE%\mmsource ^
            --hl2sdk-root=%GITHUB_WORKSPACE% ^
            --sdks=dod

      - name: Build
        working-directory: src/build
        run: ambuild

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
          path: src/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip Artifacts
        run: |
          cd artifacts
          for d in dodhooks-*; do zip -r "../$d.zip" "$d"; done
          cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: dodhooks-*.zip
