name: build
on:
  push:
    branches: [master, main, sm-1.12]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86
            cc: clang
            cxx: clang++
          - os: ubuntu-22.04
            arch: x86_64
            cc: clang
            cxx: clang++
          - os: windows-2022
            arch: x86
            msvc_arch: x86
          - os: windows-2022
            arch: x86_64
            msvc_arch: x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: src

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod
      - run: git -C sourcemod submodule update --init --recursive

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.11-dev
          path: mmsource

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: hl2sdk-dods

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      # Python 3.11 最稳，3.14 在 Windows GHA 上 ambuild 有边缘问题
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AMBuild (Linux)
        if: runner.os == 'Linux'
        run: sudo pip install ./ambuild
      - name: Install AMBuild (Windows)
        if: runner.os == 'Windows'
        run: pip install ./ambuild

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib lib32stdc++6 \
            zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386
          if [ "${{ matrix.arch }}" = "x86_64" ]; then sudo apt-get install -y clang; fi

      - name: MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # ===== Configure =====
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        working-directory: src
        run: |
          python3 configure.py \
            --targets=${{ matrix.arch }} \
            --outdir=build \
            --enable-optimize \
            --sm-path=$GITHUB_WORKSPACE/sourcemod \
            --mms-path=$GITHUB_WORKSPACE/mmsource \
            --hl2sdk-root=$GITHUB_WORKSPACE \
            --sdks=dod

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          python ../configure.py ^
            --targets=${{ matrix.arch }} ^
            --outdir=. ^
            --enable-optimize ^
            --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
            --mms-path=%GITHUB_WORKSPACE%\mmsource ^
            --hl2sdk-root=%GITHUB_WORKSPACE% ^
            --sdks=dod
          if errorlevel 1 exit /b 1

      # ===== Build =====
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: src/build
        run: ambuild

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: src/build
        shell: cmd
        run: ambuild

      # ===== Package artifact =====
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
          path: src/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip
        run: |
          cd artifacts
          for d in dodhooks-*; do zip -r "../$d.zip" "$d"; done
          cd ..
      - uses: softprops/action-gh-release@v2
        with: { files: dodhooks-*.zip }
