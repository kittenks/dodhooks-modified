name: Build

on:
  push:
    branches: [main, master, sm-1.12]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86
            cc: gcc
            cxx: g++
            msvc_arch: ""
          - os: ubuntu-22.04
            arch: x86_64
            cc: clang
            cxx: clang++
            msvc_arch: ""
          - os: windows-2022
            arch: x86
            cc: cl
            cxx: cl
            msvc_arch: x86
          - os: windows-2022
            arch: x86_64
            cc: cl
            cxx: cl
            msvc_arch: x64

    steps:
      - name: Checkout dodhooks
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: src

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod

      - name: SourceMod submodules
        run: git -C sourcemod submodule update --init --recursive

      - name: Checkout MM:S
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.11-dev
          path: mmsource

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: hl2sdk-dods

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      # ✅ 锁 3.11，避开 3.14 的 AMBuild 兼容问题
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AMBuild (Linux)
        if: runner.os == 'Linux'
        run: sudo pip install ./ambuild

      - name: Install AMBuild (Windows)
        if: runner.os == 'Windows'
        run: pip install ./ambuild

      - name: Linux x86 multilib
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib lib32stdc++6 \
            zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # ─── Linux Configure + Build ───
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: src
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf build
          mkdir build && cd build
          python3 ../configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=$GITHUB_WORKSPACE/sourcemod \
            --mms-path=$GITHUB_WORKSPACE/mmsource \
            --hl2sdk-root=$GITHUB_WORKSPACE \
            --sdks=dod
          test -f .ambuild2/vars || { echo "configure failed"; exit 1; }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: src/build
        run: ambuild

      # ─── Windows Configure + Build ───
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: src
        run: |
          if exist build rmdir /s /q build
          mkdir build && cd build
          python ../configure.py ^
            --targets=${{ matrix.arch }} ^
            --enable-optimize ^
            --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
            --mms-path=%GITHUB_WORKSPACE%\mmsource ^
            --hl2sdk-root=%GITHUB_WORKSPACE% ^
            --sdks=dod
          if errorlevel 1 exit /b 1
          if not exist .ambuild2\vars (
            echo configure did not produce .ambuild2\vars
            exit /b 1
          )

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: src/build
        run: ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
          path: src/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per target
        run: |
          cd artifacts
          for d in dodhooks-*; do zip -r "../$d.zip" "$d"; done
          cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: dodhooks-*.zip
