name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            cc: gcc
            cxx: g++
            msvc_arch: ""
          - os: windows-2022
            arch: x86_64
            cc: cl
            cxx: cl
            msvc_arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod

      - name: Checkout MetaMod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.11-dev
          path: mmsource

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: hl2sdk-dods

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ 直接装 PyPI 上的稳定版，不拉源码目录，版本锁死
      - name: Install AMBuild 2.2.0
        run: pip install ambuild==2.2.0

      - name: Install Linux deps
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: sudo apt-get update && sudo apt-get install -y clang libc6-dev

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: src
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf build
          mkdir build && cd build
          python3 ../configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=$GITHUB_WORKSPACE/sourcemod \
            --mms-path=$GITHUB_WORKSPACE/mmsource \
            --hl2sdk-root=$GITHUB_WORKSPACE \
            --sdks=dod

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          mkdir build && cd build
          python ../configure.py ^
            --targets=${{ matrix.arch }} ^
            --enable-optimize ^
            --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
            --mms-path=%GITHUB_WORKSPACE%\mmsource ^
            --hl2sdk-root=%GITHUB_WORKSPACE% ^
            --sdks=dod

      - name: Build
        working-directory: src/build
        run: ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
          path: src/build/package/*
          if-no-files-found: error
