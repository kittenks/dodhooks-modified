name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86
            compiler: gcc
          - os: ubuntu-22.04
            target: x86_64
            compiler: gcc
          - os: windows-2022
            target: x86
          - os: windows-2022
            target: x64

    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Clone SM SDK
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sm-sdk

      - name: Clone MM:S
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: mmsdk
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install AMBuild
        run: pip install git+https://github.com/alliedmodders/ambuild.git

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir build && cd build
          python3 ../configure.py --sm-path ../sm-sdk --mms-path ../mmsdk \
            --target ${{ matrix.target }} --enable-optimize
          ambuild

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.target == 'x64' && 'x64' || 'x86' }}
          mkdir build && cd build
          python ../configure.py --sm-path ../sm-sdk --mms-path ../mmsdk --target ${{ matrix.target }} --enable-optimize
          ambuild

      - uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ matrix.os }}-${{ matrix.target }}
          path: build/package/
