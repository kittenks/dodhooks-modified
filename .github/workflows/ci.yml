name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SM_BRANCH: "1.12-dev"
  MMSOURCE_BRANCH: "1.12-dev"
  HL2SDK_DODS_BRANCH: "dods"
  PYTHON_VERSION: "3.11"
  AMBUILD_FIX_COMMIT: "6fdb59c06f43a4e6b1bcb401f7686a8601a1fb4a"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            msvc_arch: ""
          - os: ubuntu-22.04
            arch: x86
            msvc_arch: ""
          - os: windows-2022
            arch: x86_64
            msvc_arch: x64
          - os: windows-2022
            arch: x86
            msvc_arch: x86

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout dodhooks source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: dodhooks

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ env.SM_BRANCH }}
          path: sourcemod
          fetch-depth: 0

      - name: Checkout MetaMod‑Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ env.MMSOURCE_BRANCH }}
          path: mmsource
          fetch-depth: 0

      - name: Checkout hl2sdk‑dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ env.HL2SDK_DODS_BRANCH }}
          path: hl2sdk-dods
          fetch-depth: 0

      # ===== 参考SteamWorks方式获取AMBuild，固定commit hash，fetch‑depth:0获取完整历史 =====
      - name: Checkout AMBuild fixed commit (2.2‑API)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          ref: ${{ env.AMBUILD_FIX_COMMIT }}
          path: ambuild
          fetch-depth: 0

      - name: Set‑up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 现代ambuild安装，官方推荐 pip install ./ambuild，替代setup.py install
      - name: Install AMBuild
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install ./ambuild

      - name: Verify AMBuild2 Extension import
        run: |
          python -c "from ambuild2 import Extension; print('✅ OK: Extension class loaded, AMBuild 2.2 API')"

      - name: Install Linux multilib dependencies
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib lib32stdc++6 zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

      - name: Install Linux x86_64 dependencies
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libc6-dev

      - name: Setup MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Configure，工作目录=dodhooks项目根，和SteamWorks保持一致
      - name: Configure build
        working-directory: dodhooks
        run: |
          python configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=${{ github.workspace }}/sourcemod \
            --mms-path=${{ github.workspace }}/mmsource \
            --hl2sdk-root=${{ github.workspace }} \
            --sdks=dod
        shell: pwsh

      - name: Check configure generated .ambuild2/vars
        working-directory: dodhooks
        run: |
          if (-not (Test‑Path ".ambuild2/vars")) { Write‑Error "❌ configure failed, no .ambuild2/vars"; exit 1 }
          Write‑Host "✅ configure success, .ambuild2/vars exists"
        shell: pwsh

      - name: Run ambuild compile
        working-directory: dodhooks
        run: ambuild
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks‑${{ runner.os }}‑${{ matrix.arch }}
          path: dodhooks/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu‑22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release zip
        run: |
          cd artifacts
          for d in dodhooks‑*; do zip -r "../$d.zip" "$d"; done
      - uses: softprops/action‑gh‑release@v2
        with:
          files: dodhooks‑*.zip
