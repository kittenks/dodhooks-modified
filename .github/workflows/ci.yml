name: Build DODHooks

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64, tag: x64 }
          - { os: ubuntu-22.04, target: x86,    tag: x86 }
          - { os: windows-2022, target: x86_64, tag: win64 }
          - { os: windows-2022, target: x86,    tag: win32 }

    steps:
      - name: Checkout extension
        uses: actions/checkout@v5
        with: { submodules: recursive }

      - name: Checkout SM SDK
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: deps/sourcemod

      - name: Checkout MM:S
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: deps/mmsource
          submodules: recursive

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: deps/hl2sdk-dods

      # ── Linux 32-bit toolchain ──────────────────────
      - name: Install multilib (x86)
        if: runner.os == 'Linux' && matrix.target == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib libstdc++6:i386

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install AMBuild
        run: pip install git+https://github.com/alliedmodders/ambuild.git

      # ── Linux Build ──────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir build && cd build
          python3 ../configure.py \
            --sm-path ../deps/sourcemod \
            --mms-path ../deps/mmsource \
            --hl2sdk-root ../deps \
            --target ${{ matrix.target }} \
            --enable-optimize

      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: ambuild build

      # ── Windows Build ───────────────────────────────
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.target == 'x86_64' && 'x64' || 'x86' }}
          if not exist build mkdir build
          cd build
          python ../configure.py ^
            --sm-path ../deps/sourcemod ^
            --mms-path ../deps/mmsource ^
            --hl2sdk-root ../deps ^
            --target ${{ matrix.target }} ^
            --enable-optimize

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd build
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ matrix.tag }}
          path: build/package/

  release:
    # 只在推送 tag 时运行（例如：refs/tags/v1.2.3）
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        # ncipollo/release-action 会创建 release 并上传 files 指定的文件
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**
