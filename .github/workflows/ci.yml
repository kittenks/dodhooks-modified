name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SM_BRANCH: "1.12-dev"
  MMSOURCE_BRANCH: "1.12-dev"
  HL2SDK_DODS_BRANCH: "dods"
  PYTHON_VERSION: "3.11"
  # 该commit尚未3.x重构，保留ambuild2.Extension类
  AMBUILD_REF: "73353142657c451238726410244070174317425c"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            msvc_arch: ""
          - os: ubuntu-22.04
            arch: x86
            msvc_arch: ""
          - os: windows-2022
            arch: x86_64
            msvc_arch: x64
          - os: windows-2022
            arch: x86
            msvc_arch: x86

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout dodhooks source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: dodhooks

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ env.SM_BRANCH }}
          path: sourcemod
          fetch-depth: 0

      - name: Checkout MetaMod‑Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ env.MMSOURCE_BRANCH }}
          path: mmsource
          fetch-depth: 0

      - name: Checkout hl2sdk‑dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ env.HL2SDK_DODS_BRANCH }}
          path: hl2sdk-dods
          fetch-depth: 0

      - name: Set‑up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ✅关键：pip直接从git安装指定commit，不需要本地ambuild文件夹，绕开所有checkout/git clone坑
      - name: Install AMBuild from git fixed commit
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "git+https://github.com/alliedmodders/ambuild.git@${{ env.AMBUILD_REF }}"
        shell: pwsh

      - name: Verify AMBuild2 Extension import
        run: |
          python -c "from ambuild2 import Extension; print('✅ OK: Extension class loaded, AMBuild 2.2 API')"
        shell: pwsh

      - name: Install Linux multilib dependencies
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib lib32stdc++6 zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

      - name: Install Linux x86_64 dependencies
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libc6-dev

      - name: Setup MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure build
        working-directory: dodhooks
        run: |
          python configure.py `
            --targets=${{ matrix.arch }} `
            --enable-optimize `
            --sm-path=${{ github.workspace }}/sourcemod `
            --mms-path=${{ github.workspace }}/mmsource `
            --hl2sdk-root=${{ github.workspace }} `
            --sdks=dod
        shell: pwsh

      - name: Check configure generated .ambuild2/vars
        working-directory: dodhooks
        run: |
          if (-not (Test‑Path ".ambuild2/vars")) { Write‑Error "❌ configure failed, no .ambuild2/vars"; exit 1 }
          Write‑Host "✅ configure success, .ambuild2/vars exists"
        shell: pwsh

      - name: Run ambuild compile
        working-directory: dodhooks
        run: ambuild
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks‑${{ runner.os }}‑${{ matrix.arch }}
          path: dodhooks/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu‑22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release zip
        run: |
          cd artifacts
          for d in dodhooks‑*; do zip -r "../$d.zip" "$d"; done
      - uses: softprops/action‑gh‑release@v2
        with:
          files: dodhooks‑*.zip
