name: Build

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SM_BRANCH: "1.12-dev"
  MMSOURCE_BRANCH: "1.12-dev"
  HL2SDK_DODS_BRANCH: "dods"
  PYTHON_VERSION: "3.11"
  AMBUILD_TAG: "2.2.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            cc: gcc
            cxx: g++
            msvc_arch: ""
          - os: ubuntu-22.04
            arch: x86
            cc: gcc
            cxx: g++
            msvc_arch: ""
          - os: windows-2022
            arch: x86_64
            cc: cl
            cxx: cl
            msvc_arch: x64
          - os: windows-2022
            arch: x86
            cc: cl
            cxx: cl
            msvc_arch: x86

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout dodhooks
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: dodhooks

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ env.SM_BRANCH }}
          path: sourcemod

      - name: Checkout MetaMod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ env.MMSOURCE_BRANCH }}
          path: mmsource

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ env.HL2SDK_DODS_BRANCH }}
          path: hl2sdk-dods

      # 直接clone并且锁定tag 2.2.0，无--depth参数，windows/linux兼容
      - name: Clone AMBuild tag 2.2.0
        run: |
          git clone --branch 2.2.0 https://github.com/alliedmodders/ambuild.git ambuild

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AMBuild (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools
          cd ambuild && python setup.py install && cd ..

      - name: Install AMBuild (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install --upgrade pip setuptools
          cd ambuild && python setup.py install && cd ..

      - name: Verify AMBuild version
        run: |
          python -c "import ambuild2; print('AMBuild version:', ambuild2.__version__)"

      - name: Install Linux x86 multilib
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib lib32stdc++6 \
            zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386

      - name: Install Linux x86_64 deps
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: sudo apt-get install -y gcc g++ libc6-dev

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: dodhooks
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf build
          mkdir build && cd build
          python3 ../configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=${{ github.workspace }}/sourcemod \
            --mms-path=${{ github.workspace }}/mmsource \
            --hl2sdk-root=${{ github.workspace }} \
            --sdks=dod
          test -f .ambuild2/vars || { echo "configure failed"; exit 1; }

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: dodhooks
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          mkdir build && cd build
          python ..\configure.py ^
            --targets=${{ matrix.arch }} ^
            --enable-optimize ^
            --sm-path=%GITHUB_WORKSPACE%\sourcemod ^
            --mms-path=%GITHUB_WORKSPACE%\mmsource ^
            --hl2sdk-root=%GITHUB_WORKSPACE% ^
            --sdks=dod
          if not exist .ambuild2\vars (
            echo configure did not produce .ambuild2\vars
            exit /b 1
          )

      - name: Build
        working-directory: dodhooks/build
        run: ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
          path: dodhooks/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          for d in dodhooks-*; do zip -r "../$d.zip" "$d"; done
          cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: dodhooks-*.zip
