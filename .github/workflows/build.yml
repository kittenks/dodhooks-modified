name: Build

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SM_BRANCH: "1.12-dev"
  MMSOURCE_BRANCH: "1.12-dev"
  HL2SDK_DODS_BRANCH: "dods"
  PYTHON_VERSION: "3.11"
  AMBUILD_BRANCH: "master"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            cc: gcc
            cxx: g++
            msvc_arch: ""
          - os: ubuntu-22.04
            arch: x86
            cc: gcc
            cxx: g++
            msvc_arch: ""
          - os: windows-2022
            arch: x86_64
            cc: cl
            cxx: cl
            msvc_arch: x64
          - os: windows-2022
            arch: x86
            cc: cl
            cxx: cl
            msvc_arch: x86

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout dodhooks
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: dodhooks

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ env.SM_BRANCH }}
          path: sourcemod

      - name: Checkout MetaMod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ env.MMSOURCE_BRANCH }}
          path: mmsource

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ env.HL2SDK_DODS_BRANCH }}
          path: hl2sdk-dods

      - name: Checkout AMBuild source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          ref: ${{ env.AMBUILD_BRANCH }}
          path: ambuild

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AMBuild (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install ./ambuild
        shell: bash

      - name: Install AMBuild (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install .\ambuild
        shell: pwsh

      - name: Verify AMBuild install
        run: |
          python -c "from ambuild2 import run; print('AMBuild API:', getattr(run, 'CURRENT_API', 'unknown'))"
          python -c "from ambuild2 import Extension; print('Extension module: OK')"
        shell: bash
        if: runner.os == 'Linux'

      - name: Verify AMBuild install (Windows)
        run: |
          python -c "from ambuild2 import run; print('AMBuild API:', getattr(run, 'CURRENT_API', 'unknown'))"
          python -c "from ambuild2 import Extension; print('Extension module: OK')"
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Install Linux x86 multilib
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib lib32stdc++6 \
            zlib1g-dev zlib1g-dev:i386 libc6-dev-i386 linux-libc-dev:i386
        shell: bash

      - name: Install Linux x86_64 deps
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ libc6-dev
        shell: bash

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: dodhooks
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf build
          mkdir build && cd build
          python3 ../configure.py \
            --targets=${{ matrix.arch }} \
            --enable-optimize \
            --sm-path=${{ github.workspace }}/sourcemod \
            --mms-path=${{ github.workspace }}/mmsource \
            --hl2sdk-root=${{ github.workspace }} \
            --sdks=dod
          test -f .ambuild2/vars || { echo "ERROR: configure did not produce .ambuild2/vars"; exit 1; }
          echo "Configure OK - .ambuild2/vars exists"
        shell: bash

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: dodhooks
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          mkdir build && cd build
          python ..\configure.py ^
            --targets=${{ matrix.arch }} ^
            --enable-optimize ^
            --sm-path=${{ github.workspace }}\sourcemod ^
            --mms-path=${{ github.workspace }}\mmsource ^
            --hl2sdk-root=${{ github.workspace }} ^
            --sdks=dod
          if not exist .ambuild2\vars (
            echo ERROR: configure did not produce .ambuild2\vars
            exit /b 1
          )
          echo Configure OK - .ambuild2\vars exists

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: dodhooks/build
        run: ambuild
        shell: bash

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: dodhooks/build
        run: ambuild
        shell: pwsh

      - name: Show build output (debug)
        if: always()
        working-directory: dodhooks/build
        run: |
          echo "=== Build directory contents ==="
          ls -la
          if [ -d "package" ]; then echo "=== Package contents ==="; ls -la package/; fi
          if [ -d ".ambuild2" ]; then echo "=== .ambuild2 contents ==="; ls -la .ambuild2/; fi
        shell: bash
        if: runner.os == 'Linux'

      - name: Show build output (debug, Windows)
        if: always() && runner.os == 'Windows'
        working-directory: dodhooks/build
        run: |
          echo "=== Build directory contents ==="
          Get-ChildItem -Force
          if (Test-Path "package") { echo "=== Package contents ==="; Get-ChildItem package -Force }
          if (Test-Path ".ambuild2") { echo "=== .ambuild2 contents ==="; Get-ChildItem .ambuild2 -Force }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodhooks-${{ runner.os }}-${{ matrix.arch }}
          path: dodhooks/build/package/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          for d in dodhooks-*; do zip -r "../$d.zip" "$d"; done
          cd ..
          ls -la *.zip
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: dodhooks-*.zip
